name: Windows portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
permissions:
  contents: read
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Verify source, build Windows EXE, and test without Python on PATH
        run: python scripts/build_windows.py
      - name: Publish verified portable and source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
